<style>
:root{--paper:#F8F7F3;--paper2:#FFFFFF;--ink:#20201A;--ink60:#5b5c50;--jade:#4F7D66;--jade-d:#3C6350;--brass:#987A38;--seal:#A5372B;--line:#E4E3DC;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.45}
body{max-width:520px;margin:0 auto;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.kr{font-family:"Noto Serif KR","Apple SD Gothic Neo",serif}
a{color:inherit}button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
header{padding:22px 20px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);z-index:20}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .en{font-family:"Fraunces",serif;font-weight:600;font-size:26px}

.tag{font-family:"Fraunces",serif;font-style:italic;font-size:15px;color:var(--ink60);margin-top:3px}
.subcopy{font-family:"Fraunces",serif;font-weight:600;font-size:13px;letter-spacing:.03em;color:var(--jade-d);margin-top:6px}
.count{margin-top:12px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink60)}
.aboutlink{margin-left:10px;font-family:"Fraunces",serif;font-style:italic;font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--jade-d);text-decoration:underline;text-underline-offset:3px}
.feat{width:100%;text-align:left;display:block;padding:18px 16px;margin:6px 2px 12px;border:1px solid var(--line);border-radius:3px;background:var(--paper2)}
.feat:active{background:var(--paper)}
.feat .fnm{font-family:"Fraunces",serif;font-weight:600;font-size:21px;line-height:1.25}
.feat .fkr{font-family:"Noto Serif KR","Apple SD Gothic Neo",serif;font-size:13px;color:var(--jade-d);margin-top:2px}
.feat .fmeta{font-size:12.5px;color:var(--ink60);margin-top:4px;letter-spacing:.02em}
.feat .fst{font-size:14px;line-height:1.62;color:var(--ink);margin-top:11px}
.tools{padding:14px 16px 6px;position:sticky;top:96px;background:var(--paper);z-index:15}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:2px;background:var(--paper2);font-size:15px}
.search:focus{outline:2px solid var(--jade);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 12px;border:1px solid var(--line);border-radius:100px;font-size:13px;color:var(--ink60);background:var(--paper2)}
.chip.on{background:var(--jade);color:#fff;border-color:var(--jade)}
.sortrow{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 0;font-size:12.5px;color:var(--ink60)}
.sortbtn{text-decoration:underline;text-underline-offset:3px}
main{padding:6px 12px 40px}
.card{width:100%;text-align:left;padding:16px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.card:active{background:var(--paper2)}
.name{font-family:"Fraunces",serif;font-weight:600;font-size:19px;line-height:1.25}
.name.unv{font-style:italic}
.namekr{grid-column:1;font-family:"Noto Serif KR","Apple SD Gothic Neo",serif;font-size:13px;color:var(--jade-d);margin-top:1px}
.unvtag{grid-column:1;font-family:"Fraunces",serif;font-style:italic;font-size:10.5px;letter-spacing:.04em;color:var(--brass);margin-top:3px}
.meta{grid-column:1;font-size:12.5px;color:var(--ink60);margin-top:3px;letter-spacing:.02em}
.year{grid-row:1/-1;grid-column:2;text-align:right;font-family:"Fraunces",serif;font-weight:600;font-size:27px;color:var(--jade-d);line-height:1}
.year small{display:block;font-family:"Inter";font-weight:500;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink60);margin-top:3px}
.year.tbd{font-size:13px;color:var(--brass);font-style:italic;font-family:"Fraunces",serif}
.badge{display:inline-block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:2px;vertical-align:middle;margin-left:6px}
.b-h{background:color-mix(in srgb,var(--brass) 18%,transparent);color:var(--brass)}
.b-o{background:color-mix(in srgb,var(--jade) 16%,transparent);color:var(--jade-d)}
.empty{padding:40px 20px;text-align:center;color:var(--ink60);font-size:14px}
.detail{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--paper);overflow-y:auto;z-index:40;transform:translateX(100%);visibility:hidden;transition:transform .28s cubic-bezier(.4,0,.2,1),visibility 0s linear .28s}
.detail.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.back{position:sticky;top:0;padding:14px 16px;background:var(--paper);border-bottom:1px solid var(--line);font-size:14px;color:var(--jade-d);z-index:2}
.hero{padding:30px 22px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--paper2),var(--paper))}
.hero .yr{font-family:"Fraunces",serif;font-weight:600;font-size:62px;line-height:.9;color:var(--jade-d)}
.hero .yr.tbd{font-size:22px;color:var(--brass);font-style:italic}
.hero .since{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink60);margin-bottom:8px}
.hero .nm{font-family:"Fraunces",serif;font-weight:700;font-size:30px;margin-top:14px;line-height:1.2}
.hero .nm.unv{font-style:italic}
.hero .nmkr{font-family:"Noto Serif KR",serif;font-weight:600;font-size:15px;color:var(--jade-d);margin-top:3px}
.hero .unvnote{font-family:"Fraunces",serif;font-style:italic;font-size:11.5px;color:var(--brass);margin-top:5px}
.hero .sub{font-size:13.5px;color:var(--ink60);margin-top:8px;letter-spacing:.02em}
.still{margin-top:14px;font-family:"Fraunces",serif;font-style:italic;font-size:15px;color:var(--jade-d)}
.story{padding:16px 22px 14px;border-bottom:1px solid var(--line)}.story .stx{font-size:14.5px;line-height:1.62;color:var(--ink);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.story .stx.open{-webkit-line-clamp:unset;display:block}.story .stmore{margin-top:9px;background:none;border:0;padding:0;font-family:"Fraunces",serif;font-style:italic;font-size:13px;color:var(--brass);cursor:pointer}.rows{padding:8px 22px}
.row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.row .k{width:74px;flex:none;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink60);padding-top:2px}
.row .v{flex:1}.row .v .kr2{font-family:"Noto Serif KR",serif}
.row .v .en{color:var(--ink60);font-size:13px;margin-top:1px}
.acts{display:flex;gap:8px;padding:16px 22px 6px;flex-wrap:wrap}
.act{flex:1;min-width:100px;text-align:center;padding:12px;border:1px solid var(--jade);border-radius:2px;color:var(--jade-d);font-weight:500;font-size:14px;background:var(--paper2)}
.act:active{background:var(--jade);color:#fff}.act.solid{background:var(--jade);color:#fff}
.sect{margin:20px 16px;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--paper2)}
.sect h3{font-family:"Fraunces",serif;font-weight:600;font-size:16px;padding:14px 16px 10px}
.sect h3 span{font-family:"Inter";font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink60);display:block;margin-top:2px}
.sig{padding:2px 16px 14px}
.sig li{list-style:none;display:flex;gap:10px;padding:8px 0;font-size:14px;line-height:1.4;border-top:1px dashed var(--line)}
.sig li:first-child{border-top:none}
.mk{flex:none;width:20px;font-weight:700;text-align:center}.mk.go{color:var(--jade)}.mk.no{color:var(--seal)}
.clips{display:flex;gap:8px;flex-wrap:wrap;padding:2px 16px 14px}
.clip{flex:1;min-width:96px;text-align:center;padding:11px 8px;border-radius:3px;font-size:13px;font-weight:600;color:#fff}
.clip em{display:block;font-style:normal;font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-top:2px}
.clip.yt{background:#FF0033}.clip.tt{background:#111}.clip.ig{background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF)}
.contact{margin:18px 16px;padding:15px 16px;border:1px solid var(--line);border-radius:3px;background:var(--paper2)}
.contact h3{font-family:"Fraunces",serif;font-weight:600;font-size:16px}.contact p{font-size:13px;color:var(--ink60);margin-top:3px}
.msgwrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msgbtn{flex:1;min-width:96px;text-align:center;padding:11px 8px;border-radius:3px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--paper2);color:var(--ink)}
.msgbtn.whatsapp{border-color:#25D366;color:#128C4B}.msgbtn.telegram{border-color:#2AABEE;color:#1E86BE}.msgbtn.line{border-color:#06C755;color:#04A247}
.msgbtn.off{color:var(--ink60);opacity:.55;cursor:default}
.msgbtn em{display:block;font-style:normal;font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.dunno{margin:20px 16px;padding:15px 16px;border-left:3px solid var(--brass);background:var(--paper2);font-size:13.5px;color:var(--ink60);line-height:1.5}
.dunno b{color:var(--ink);font-weight:600}
.foot{padding:26px 20px 40px;text-align:center;font-size:12px;color:var(--ink60);line-height:1.6}
.sheet{position:fixed;inset:0;max-width:520px;margin:0 auto;background:rgba(30,30,25,.4);z-index:60;display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheetc{background:var(--paper);width:100%;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:20px 20px 30px;animation:up .28s cubic-bezier(.4,0,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheeth{font-family:"Fraunces",serif;font-weight:600;font-size:20px}
.sheeth .kr{font-family:"Noto Serif KR",serif;font-weight:600;font-size:14px;color:var(--jade-d);display:block;margin-top:2px}
.sheetsub{font-size:13px;color:var(--ink60);margin:4px 0 16px}
.qh{font-size:14px;font-weight:600;margin:16px 0 8px}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.opt{padding:9px 14px;border:1px solid var(--line);border-radius:100px;font-size:13.5px;background:var(--paper2);color:var(--ink)}
.opt.on{background:var(--jade);color:#fff;border-color:var(--jade)}.opt.kill.on{background:var(--seal);border-color:var(--seal)}
.cmt{width:100%;margin-top:8px;padding:11px 13px;border:1px solid var(--line);border-radius:4px;background:var(--paper2);font:inherit;font-size:14px;resize:vertical;min-height:60px}
.submit{width:100%;margin-top:20px;padding:14px;background:var(--jade);color:#fff;border-radius:3px;font-size:15px;font-weight:600}
.submit:active{background:var(--jade-d)}.cancel{width:100%;margin-top:8px;padding:12px;font-size:14px;color:var(--ink60)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:100px;font-size:13.5px;z-index:80;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style></head><body>
<header><div class="brand"><span class="en">Nopo</span><span class="ko kr">노포</span></div>
  <div class="tag">Eat where the city still eats.</div><div class="subcopy">Time already checked.</div><div class="count"><span id="count"></span><button class="aboutlink" id="aboutbtn">Before you go</button></div></header>
<div class="tools"><input class="search" id="q" placeholder="Search a name, district, or dish…" autocomplete="off">
  <div class="chips" id="chips"></div>
  <div class="sortrow"><span id="shown"></span><button class="sortbtn" id="sort">Sort: oldest first</button></div></div>
<main id="list"></main><div class="detail" id="detail"></div>
<div class="sheet" id="sheet"><div class="sheetc" id="sheetc"></div></div><div class="toast" id="toast"></div>
<script>
/* ===== 운영자 계정 — 값만 채우면 문의/제보 전송 버튼이 살아납니다 =====
   whatsapp:"국가코드+번호 숫자만" · telegram:"@뺀 사용자명" · line:"공식계정ID" */
const OPERATOR = { whatsapp:"", telegram:"", line:"" };
function opLink(k,msg){ const t=encodeURIComponent(msg||"");
  if(k==="whatsapp"&&OPERATOR.whatsapp) return "https://wa.me/"+OPERATOR.whatsapp+"?text="+t;
  if(k==="telegram"&&OPERATOR.telegram) return "https://t.me/"+OPERATOR.telegram;
  if(k==="line"&&OPERATOR.line) return "https://line.me/R/ti/p/"+encodeURIComponent(OPERATOR.line);
  return ""; }
function contactButtons(msg){ const d=[["whatsapp","WhatsApp"],["telegram","Telegram"],["line","Line"]];let s="";
  d.forEach(function(x){const u=opLink(x[0],msg);
    s+=u?'<a class="msgbtn '+x[0]+'" target="_blank" href="'+u+'">'+x[1]+'</a>':'<span class="msgbtn off">'+x[1]+'<em>soon</em></span>';});return s;}
/* ===== 방문 콘텐츠 링크 — 식당 id에 추가 (yt=유튜브 tt=틱톡 ig=인스타). id는 nopo-id-lookup 참고 ===== */
const MEDIA = {
  // "n001": { yt:"", tt:"", ig:"" },
};
function mediaBlock(id){const m=MEDIA[id];if(!m)return"";let b="";
  if(m.yt)b+='<a class="clip yt" target="_blank" href="'+m.yt+'">\u25B6 YouTube<em>long</em></a>';
  if(m.tt)b+='<a class="clip tt" target="_blank" href="'+m.tt+'">TikTok<em>short</em></a>';
  if(m.ig)b+='<a class="clip ig" target="_blank" href="'+m.ig+'">Instagram<em>short</em></a>';
  return b?'<div class="sect"><h3>See it<span>clips from our visit</span></h3><div class="clips">'+b+'</div></div>':"";}

const DATA = [{"id":"n001","name":"이문설농탕","district":"종로구","cuisine":"설농탕","since":"1904","roadAddr":"서울특별시 종로구 우정국로 38-13","jibunAddr":"견지동 88-0","phone":"027336526","source":"서울미래유산","romanName":"Imun Seollongtang","enDistrict":"Jongno-gu","enCuisine":"Ox-bone soup","enAddr":"38-13 Ujeongguk-ro, Jongno-gu, Seoul","enNameSrc":"VisitSeoul","story":"Opened in 1904 as Imunok by a founder surnamed Hong — the oldest restaurant in the country and the first to hold a Seoul city licence.\nKnee cartilage and marrow bone simmer sixteen or seventeen hours into a clear broth, and no chemical seasoning has ever gone into it.\nThe bowl comes with brisket and head meat, and with spleen and ox tongue that few other houses serve.\nFour generations have kept it; when redevelopment was settled it left Gongpyeong-dong in 2011 for the present address."},{"id":"n002","name":"진아춘","district":"종로구","cuisine":"중식","since":"1925","roadAddr":"서울특별시 종로구 대명1길 18","jibunAddr":"신문로1가 163","phone":"02-765-5688","source":"서울미래유산","romanName":"Jinachun","enDistrict":"Jongno-gu","enCuisine":"Chinese","enAddr":"18 Daemyeong 1-gil, Jongno-gu, Seoul","enNameSrc":"VisitSeoul","story":"Opened in 1925, the oldest Chinese restaurant in Seoul, running since the colonial period.\nThrough the 1960s and 70s it was a fixture for Seoul National University students, some of whom left a wristwatch as collateral for a bowl of jjajangmyeon.\nThe jjajangmyeon is the plain, faithful kind — chewy noodles against the sauce.\nPhotographs from its long history hang inside, readable while you eat."},{"id":"n003","name":"용금옥","district":"중구","cuisine":"추어탕","since":"1932","roadAddr":"서울특별시 중구 다동길 24-2","jibunAddr":"다동 165-1","phone":"02-777-4749","source":"서울미래유산","romanName":"Yonggeumok","enDistrict":"Jung-gu","enCuisine":"Loach soup","enAddr":"24-2 Dadong-gil, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"A chueotang house trading since 1932.\nTwo versions are served: the Seoul style with the loach left whole, and the Namdo style with it boiled and ground.\nThe broth is built from good ingredients and long attention.\nEverything that leaves the kitchen carries the owner's own hand."},{"id":"n004","name":"은호식당","district":"중구","cuisine":"꼬리곰탕","since":"1932","roadAddr":"서울특별시 중구 남대문시장4길 28-4","jibunAddr":"남창동 50-43","phone":"0507-1367-3263","source":"서울미래유산","romanName":"Eunho Sikdang","enDistrict":"Jung-gu","enCuisine":"Oxtail soup","enAddr":"28-4 Namdaemunsijang 4-gil, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"It began seventy years ago as a stall in Namdaemun Market, selling kkori-gomtang.\nThree generations have kept the same taste since.\nOxtail soup is still the centre of the table.\nDoganitang, seolleongtang and suyuk are served alongside."},{"id":"n005","name":"잼배옥","district":"중구","cuisine":"설렁탕","since":"1933","roadAddr":"서울특별시 중구 세종대로9길 68-9","jibunAddr":"서소문동 64-4","phone":"027558106","source":"서울미래유산","romanName":"Jaembaeok","enDistrict":"Jung-gu","enCuisine":"Ox-bone soup","enAddr":"68-9 Sejong-daero 9-gil, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"A seolleongtang house in its third generation.\nIt opened in 1933 by Seoul Station and moved toward City Hall in recent years.\nThe order most people make is the assorted suyuk plate.\nHead meat, brisket, chadolbagi, ox tongue, shank and spleen come on it."},{"id":"n006","name":"청진옥","district":"종로구","cuisine":"해장국","since":"1937","roadAddr":"서울특별시 종로구 종로3길 32","jibunAddr":"청진동 183-1","phone":"027351690","source":"서울미래유산","romanName":"Cheongjinok","enDistrict":"Jongno-gu","enCuisine":"Hangover soup","enAddr":"32 Jong-ro 3-gil, Jongno-gu, Seoul","enNameSrc":"VisitSeoul","story":"It opened in 1937 as Pyeonghwagwan, a small haejangguk shop where woodcutters ate.\nAfter liberation the name changed to Cheongjinok, and it became the byword for Seoul haejangguk.\nOx bones simmer for a full day; doenjang, tripe and seonji go into the pot.\nNearly ninety years on one dish, with photographs of that history along the walls."},{"id":"n007","name":"한일관","district":"강남구","cuisine":"갈비","since":"1939","roadAddr":"서울특별시 강남구 압구정로38길 14","jibunAddr":"신사동 619-4","phone":"027335333","source":"서울미래유산","romanName":"Hanilgwan","enDistrict":"Gangnam-gu","enCuisine":"Grilled ribs","enAddr":"14 Apgujeong-ro 38-gil, Gangnam-gu, Seoul","enNameSrc":"VisitSeoul","story":"It made its name in Jongno as a bulgogi house.\nHanjeongsik, the full Korean set meal, is served now as well.\nThe lunch sets are where it competes.\nBulgogi or galbi anchors them."},{"id":"n008","name":"유진식당","district":"종로구","cuisine":"평양냉면","since":"1968","roadAddr":"서울특별시 종로구 종로17길 40","jibunAddr":"낙원동 221-0","phone":"027642835","source":"서울미래유산","romanName":"Yujin Sikdang","enDistrict":"Jongno-gu","enCuisine":"Pyeongyang cold noodles","enAddr":"40 Jong-ro 17-gil, Jongno-gu, Seoul","enNameSrc":"VisitSeoul","story":"A naengmyeon house with a following of its own.\nThe noodles are pressed in-house, buckwheat and starch in equal parts.\nThat is a high proportion of buckwheat.\nThe broth is drawn from beef and beef bone."},{"id":"n010","name":"우래옥","district":"중구","cuisine":"평양냉면","since":"1946","roadAddr":"서울특별시 중구 창경궁로 62-29","jibunAddr":"주교동 118-1","phone":"02-2265-0151","source":"서울미래유산","romanName":"Wooraeok","enDistrict":"Jung-gu","enCuisine":"Pyeongyang cold noodles","enAddr":"62-29 Changgyeonggung-ro, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"Known for bulgogi and naengmyeon.\nPeople who know naengmyeon come back for a broth drawn from beef alone.\nSixty years of Pyongyang-style naengmyeon.\nIt has opened in the United States as well."},{"id":"n011","name":"부여집","district":"영등포구","cuisine":"곰탕","since":"1947","roadAddr":"서울특별시 영등포구 선유동1로 24","jibunAddr":"","phone":"02-2633-0666","source":"서울미래유산","romanName":"Buyeojip","enDistrict":"Yeongdeungpo-gu","enCuisine":"Beef bone soup","enAddr":"24 Seonyudong 1-ro, Yeongdeungpo-gu, Seoul","enNameSrc":"romanized","story":"Opened in 1947 and now in its third generation, working on kkori-gomtang and joktang.\nThe founder Kim Nyeon-ae rented a single room in Yeongdeungpo and registered the shop under the name of Buyeo in South Chungcheong, where she came from.\nIt settled in Dangsan-dong in 1970 and rebuilt on the present site in 2010.\nThe fat is stripped from the tail, the blood drawn off, and the oil skimmed again as the broth cooks; the mukeunji beside it is made at home and aged three years."},{"id":"n012","name":"마포옥","district":"마포구","cuisine":"설렁탕","since":"1949","roadAddr":"서울특별시 마포구 토정로 312","jibunAddr":"용강동 50-13","phone":"02-716-6661","source":"서울미래유산","romanName":"MAPO-OK","enDistrict":"Mapo-gu","enCuisine":"Ox-bone soup","enAddr":"312 Tojeong-ro, Mapo-gu, Seoul","enNameSrc":"VisitSeoul","story":"A seolleongtang house that began in 1949, when the present owner's mother took over an existing yangji seolleongtang shop; three generations on.\nThe broth is drawn twice, first and second extraction, with marrow bone, brisket and chadolbagi steeped at different temperatures and for different lengths.\nNothing but beef goes into it, as a matter of principle.\nThickly cut meat comes piled on top; chadoltang and suyuk are the other orders."},{"id":"n013","name":"평래옥","district":"중구","cuisine":"평양냉면","since":"1950","roadAddr":"서울특별시 중구 마른내로 21-1","jibunAddr":"저동2가 18-1","phone":"0222675892","source":"서울미래유산","romanName":"Pyeongnaeok","enDistrict":"Jung-gu","enCuisine":"Pyeongyang cold noodles","enAddr":"21-1 Mareunnae-ro, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"The house dish is chogyetang, its broth taken from chicken.\nThe pheasant naengmyeon uses the same broth with pheasant meatballs added.\nThe nokdujeon is good, and so is the jeyuk.\nThe average customer here is older than at most places."},{"id":"n014","name":"문화옥","district":"중구","cuisine":"곰탕","since":"1952","roadAddr":"서울특별시 중구 창경궁로 62-5","jibunAddr":"주교동 118-3","phone":"02-2265-0322","source":"서울미래유산","romanName":"Munhwaok","enDistrict":"Jung-gu","enCuisine":"Beef bone soup","enAddr":"62-5 Changgyeonggung-ro, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"Fifty years of seolleongtang, across three generations.\nMarrow bone and brisket give the broth a deep colour.\nThere is regular and there is special; the special comes loaded with brisket.\nThe joktang is close to it, with well-boiled knee cartilage in the same broth."},{"id":"n015","name":"연남서식당","district":"서대문구","cuisine":"갈비","since":"1953","roadAddr":"서울특별시 서대문구 연희맛로 15","jibunAddr":"신수동 462","phone":"02-716-2520","source":"서울미래유산","romanName":"Yeonnamseosikdang","enDistrict":"Seodaemun-gu","enCuisine":"Grilled ribs","enAddr":"15 Yeonhuimat-ro, Seodaemun-gu, Seoul","enNameSrc":"romanized","story":"It began in 1953, when the founder, come from Gimpo after the war, set an oil drum on a Sinchon street and grilled meat over briquettes.\nFor years people called it Silbijip or Gimpojip; a district clerk registered the name Yeonnam Seo Sikdang in 1979 and it stuck.\nOne dish only — beef galbi in soy marinade, no chemical seasoning, cut and seasoned each morning with the sinew taken out before it meets the fire.\nYou eat standing around the drum, which is what foreigners now come for; after nine moves it settled in 2004, and moved to Yeonhui-dong in 2022."},{"id":"n016","name":"오장동흥남집","district":"중구","cuisine":"냉면","since":"1953","roadAddr":"서울특별시 중구 마른내로 114","jibunAddr":"오장동 101-7","phone":"0222660735","source":"서울미래유산","romanName":"Ojangdong Heungnamjip","enDistrict":"Jung-gu","enCuisine":"Cold noodles","enAddr":"114 Mareunnae-ro, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"Held to be the best of the Ojang-dong naengmyeon houses, and the one northern émigrés most often choose.\nHamhung style: bibim naengmyeon comes with beef, hoe naengmyeon with skate.\nThe mixed bowl has both.\nSweet potato starch noodles against the sourness of the skate."},{"id":"n017","name":"열차집","district":"종로구","cuisine":"빈대떡","since":"1954","roadAddr":"서울특별시 종로구 종로7길 47","jibunAddr":"공평동 130-1","phone":"0507-1440-2849","source":"서울미래유산","romanName":"Yeolchajip","enDistrict":"Jongno-gu","enCuisine":"Mung bean pancake","enAddr":"47 Jong-ro 7-gil, Jongno-gu, Seoul","enNameSrc":"VisitSeoul","story":"A daepojip for bindaetteok, oyster jeon and a bowl of makgeolli.\nMung beans are ground on a stone mill, spread on the iron plate, and a few pieces of pork laid over them.\nIt comes out crisp.\nBy evening the room is full of people eating it with makgeolli."},{"id":"n018","name":"미진","district":"종로구","cuisine":"메밀국수","since":"1954","roadAddr":"서울특별시 종로구 종로 19","jibunAddr":"종로1가 24","phone":"02-730-6198","source":"서울미래유산","romanName":"Mijin","enDistrict":"Jongno-gu","enCuisine":"Buckwheat noodles","enAddr":"19 Jong-ro, Jongno-gu, Seoul","enNameSrc":"VisitSeoul","story":"Sixty years of buckwheat noodles.\nThe owners have changed several times; the Korean take on memil guksu has not.\nIt sits between the Japanese version with katsuobushi and the Korean one with anchovy — faintly sweet, clean, nutty at the finish.\nSelected for the Michelin Guide Seoul 2025."},{"id":"n019","name":"왕십리 대도식당","district":"성동구","cuisine":"소고기구이","since":"1954","roadAddr":"서울특별시 성동구 무학로12길 3","jibunAddr":"홍익동 431,432","phone":"0507-1360-9772","source":"서울미래유산","romanName":"Wangsipri Daedosikdang","enDistrict":"Seongdong-gu","enCuisine":"Grilled beef","enAddr":"3 Muhak-ro 12-gil, Seongdong-gu, Seoul","enNameSrc":"romanized","story":"Sixty years of hanwoo sirloin in Wangsimni.\nThe founder learned the method from a court lady who had cooked for Crown Prince Yeongchin, and brought grilled sirloin out of the palace and to everyone else.\nIt opened in 1964, searing beef brought in daily from Hampyeong on a thick cast-iron plate rubbed first with beef kidney fat.\nFour hanok were opened into one another to make the main hall and three wings, and the plain wooden rooms have been kept that way."},{"id":"n020","name":"마포진짜원조최대포","district":"마포구","cuisine":"돼지갈비","since":"1955","roadAddr":"서울특별시 마포구 백범로 105","jibunAddr":"공덕동 255-5","phone":"02-719-6358","source":"서울미래유산","romanName":"Mapojinjjawonjochoedaepo","enDistrict":"Mapo-gu","enCuisine":"Pork ribs","enAddr":"105 Baekbeom-ro, Mapo-gu, Seoul","enNameSrc":"romanized","story":"Two generations of pork galbi in the same district since 1955.\nIt was the first place to cook pork three ways — as marinated galbi, as salt-grilled meat, and as skin.\nThe founder had worked at the Majang-dong abattoir and in restaurants before opening a small daepojip by Gongdeok rotary.\nIt also worked out the garlic sauce that the skin is dipped in, and it sells offal cuts — tripe, heart, kidney, tteoksim — alongside."},{"id":"n021","name":"원조 할머니 떡볶이","district":"종로구","cuisine":"떡볶이","since":"1956","roadAddr":"서울특별시 종로구 자하문로15길 13","jibunAddr":"서울시 종로구 통인동 94-1","phone":"02-725-4870","source":"서울미래유산","romanName":"Wonjo Halmeoni Tteokbokki","enDistrict":"Jongno-gu","enCuisine":"Tteokbokki","enAddr":"13 Jahamun-ro 15-gil, Jongno-gu, Seoul","enNameSrc":"romanized","story":"In 1956 a woman surnamed Maeng, displaced from the North, set up a stall on Jahamun-ro; three generations later it is still gireum tteokbokki.\nThe rice cakes are turned through a soy and chili seasoning aged a day, then fried in oil on the lid of an iron cauldron.\nNo water touches it, so it does not go soft as it cools — order it hot or order it cold.\nThe rice cakes are cut for this dish alone and come from the tteok shop next door; 40 to 60 kilos on a weekday, and the day ends when they are gone."},{"id":"n022","name":"부민옥","district":"중구","cuisine":"육개장","since":"1956","roadAddr":"서울특별시 중구 다동길 24-12","jibunAddr":"다동 134-4","phone":"02-777-2345","source":"서울미래유산","romanName":"Buminok","enDistrict":"Jung-gu","enCuisine":"Spicy beef soup","enAddr":"24-12 Dadong-gil, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"A yukgaejang house in Dadong, Jung-gu, carried through the 1980s and 90s by office workers.\nThe founder came from the North and opened it on what he had learned trading in Bumin-dong, Busan, during the war.\nThe yukgaejang is clean and plain, heavy with spring onion and beef.\nIn the evening people come for it with soju, at tables set far enough apart to stay a while."},{"id":"n023","name":"삼거리먼지막순대국","district":"영등포구","cuisine":"순대국","since":"1957","roadAddr":"서울특별시 영등포구 시흥대로185길 11","jibunAddr":"대림동 963-9","phone":"028482469","source":"서울미래유산","romanName":"Samgeorimeonjimaksundaeguk","enDistrict":"Yeongdeungpo-gu","enCuisine":"Blood sausage soup","enAddr":"11 Siheung-daero 185-gil, Yeongdeungpo-gu, Seoul","enNameSrc":"romanized","story":"It started in 1957 inside Daerim Market, where Kim Jun-su sold gukbap and noodles, and registered formally as a sundaeguk house in 1959.\nThere is no secret to it: domestic pork, never frozen, boiled down for the broth the way it always was.\nThe bowls are filled deep and the broth carries no off smell, and the fat is left out for anyone who would rather not have it.\nIt moved to the present spot in 1990, took its name from what the neighborhood used to be called, and serves sundaeguk and little else."},{"id":"n024","name":"태조감자국","district":"성북구","cuisine":"감자국","since":"1958","roadAddr":"서울특별시 성북구 보문로34길 43","jibunAddr":"동선동1가 49-0","phone":"02-921-7667","source":"서울미래유산","romanName":"Taejogamjaguk","enDistrict":"Seongbuk-gu","enCuisine":"Pork-bone potato stew","enAddr":"43 Bomun-ro 34-gil, Seongbuk-gu, Seoul","enNameSrc":"romanized","story":"Lee Du-hwan opened Buamjip in 1958 at the entrance of Donam Market with a dish he had worked out himself.\nThere was no word for gamjatang then, and because the dish ran to broth he called it gamjaguk — soup rather than stew.\nPork bought in the market and marrow bone make a broth milder and clearer than most, heaped with potato, sujebi, rape greens and ground perilla.\nThe founder's grandsons run it now; redevelopment moved it to Bomun-ro in 2019, and gamjaguk is the only thing served."},{"id":"n025","name":"오장동함흥냉면","district":"중구","cuisine":"냉면","since":"1953","roadAddr":"서울특별시 중구 마른내로 108","jibunAddr":"오장동 90-10","phone":"0222679500","source":"서울미래유산","romanName":"Ojangdong Hamheung Naengmyeon","enDistrict":"Jung-gu","enCuisine":"Cold noodles","enAddr":"108 Mareunnae-ro, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"Han Hye-seon opened it in Ojang-dong after the Korean War.\nIt is the house that carried Hamhung naengmyeon, the food of Hamgyong province, to the rest of the country.\nFrom the 1970s, redevelopment took most of the Hamhung houses on that street; this one stayed.\nHot sauce, fresh raw fish on top, thin noodles, with sugar, sesame oil and vinegar balanced behind them."},{"id":"n026","name":"고려삼계탕","district":"중구","cuisine":"삼계탕","since":"1960","roadAddr":"서울특별시 중구 서소문로11길 1","jibunAddr":"서소문동 55-3","phone":"02-752-9376","source":"서울미래유산","romanName":"Goryeo Samgyetang","enDistrict":"Jung-gu","enCuisine":"Ginseng chicken soup","enAddr":"1 Seosomun-ro 11-gil, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"Lee Sang-rim opened it in the 1950s, just after the war.\nThe birds are raised seven weeks, so the skin holds while the meat stays soft.\nThe broth is thick and clean at once.\nThe room is large and easy, and it was selected for the Michelin Guide in 2020."},{"id":"n027","name":"유림면","district":"중구","cuisine":"국수","since":"1960","roadAddr":"서울특별시 중구 서소문로 139-1","jibunAddr":"서소문동 16","phone":"027550659","source":"서울미래유산","romanName":"Yurimmyeon","enDistrict":"Jung-gu","enCuisine":"Noodles","enAddr":"139-1 Seosomun-ro, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"A noodle house in Seosomun-dong, opened in 1960 and now in its third generation.\nRelief flour was arriving at the time, and the shop began as a way for people to eat cheaply.\nThe dough is aged in advance and boiled the moment an order comes.\nThe dish to order is bibim memil guksu — chewy noodles, hot-sweet sauce, fresh garnish, ground perilla."},{"id":"n028","name":"초가집","district":"강북구","cuisine":"한정식","since":"1960","roadAddr":"서울특별시 강북구 삼양로173길 116-28","jibunAddr":"우이동 252-0","phone":"02-993-3758","source":"서울미래유산","romanName":"Chogajip","enDistrict":"Gangbuk-gu","enCuisine":"Korean set meal","enAddr":"116-28 Samyang-ro 173-gil, Gangbuk-gu, Seoul","enNameSrc":"romanized","story":"Opened in 1960, when the founder began feeding visitors who passed through; the second generation runs it now.\nThe set meal grew out of the family's own everyday farm table, with bulgogi and a few dishes added for guests.\nThe family has worked this land for ten generations and still grows much of what reaches the table.\nIt once served a thousand people a day; today it is quieter, in the same house it slowly expanded into."},{"id":"n030","name":"서북면옥","district":"광진구","cuisine":"냉면","since":"1968","roadAddr":"서울특별시 광진구 자양로 199-1","jibunAddr":"구의동 80-47","phone":"024578319","source":"서울미래유산","romanName":"Seobukmyeonok","enDistrict":"Gwangjin-gu","enCuisine":"Cold noodles","enAddr":"199-1 Jayang-ro, Gwangjin-gu, Seoul","enNameSrc":"romanized","story":"A Pyongyang naengmyeon house opened in 1968 and still on the same corner, second generation.\nSeoul's old naengmyeon houses cluster in Jongno and Euljiro; this one made its name in the northeast, and the crossing in front of it is now called after the shop.\nThe name carries Seobuk, for the Hwanghae region the founder's wife came from, and Lee Gyeong-mi learned the cooking from her after marrying into the family in 1981.\nBuckwheat milled in-house makes up seventy percent of the noodle, the broth is brisket, shank and sirloin skimmed cold — eaten uncut, which is the only way to taste it."},{"id":"n032","name":"산골막국수","district":"중구","cuisine":"막국수","since":"1962","roadAddr":"서울특별시 중구 을지로 175-3","jibunAddr":"을지로4가 61-0","phone":"0222665409","source":"서울미래유산","romanName":"Sangolmakguksu","enDistrict":"Jung-gu","enCuisine":"Buckwheat noodles","enAddr":"175-3 Eulji-ro, Jung-gu, Seoul","enNameSrc":"romanized","story":"Im Geum-rye opened it in Chuncheon in 1962; her daughter-in-law cooks it now.\nMakguksu means noodles thrown together roughly, a late-night dish of the mountain country north of Gangwon, and she was the one who made it something to sell.\nThe dough is mixed with hot water and quenched three times in the pot, which is why the noodle holds without breaking; the broth is marrow bone and chicken bone in equal parts.\nIt moved to Dadong in Seoul in 1969, and to Euljiro in 1972 when that building came down."},{"id":"n033","name":"역전회관","district":"마포구","cuisine":"바싹불고기","since":"1962","roadAddr":"서울특별시 마포구 토정로37길 47","jibunAddr":"염리동 173-21","phone":"02-703-0019","source":"서울미래유산","romanName":"Yeokjeon Hoegwan","enDistrict":"Mapo-gu","enCuisine":"Crispy bulgogi","enAddr":"47 Tojeong-ro 37-gil, Mapo-gu, Seoul","enNameSrc":"VisitSeoul","story":"Hong Jong-yeop opened Yeokjeon Sikdang in front of Yongsan Station in 1962, having learned to cook from her husband's family, who ran a restaurant in Suncheon.\nIt made its name there on bassak bulgogi and seonji sulguk; her son took it over in 1990 and changed the name to Yeokjeon Hoegwan.\nRedevelopment moved it to Mapo in 2007, and a third generation is learning the kitchen now.\nBassak bulgogi is thin-sliced skirt, marinated and seared hard over a high flame — a variant of Seoul neobiani in which everything turns on the strength of the fire."},{"id":"n034","name":"진주회관","district":"중구","cuisine":"콩국수","since":"1962","roadAddr":"서울특별시 중구 세종대로11길 26","jibunAddr":"서소문동 120-35","phone":"027535388","source":"서울미래유산","romanName":"Jinju Hoegwan","enDistrict":"Jung-gu","enCuisine":"Chilled soy-milk noodles","enAddr":"26 Sejong-daero 11-gil, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"Known for kongguksu, the cold soybean noodle soup Koreans eat through the summer.\nPotato starch and nuts are worked into the flour for the noodles.\nKongguksu in summer, kimchi fried rice in winter.\nThere are enough regulars that there is usually a line."},{"id":"n036","name":"안동장","district":"중구","cuisine":"중식","since":"1948","roadAddr":"서울특별시 중구 을지로 124","jibunAddr":"을지로3가 315-18","phone":"0222663814","source":"서울미래유산","romanName":"Andongjang","enDistrict":"Jung-gu","enCuisine":"Chinese","enAddr":"124 Eulji-ro, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"The oldest Chinese restaurant still in business.\nThe taste has come down since 1948.\nWhat it is known for is gul jjamppong, made with oysters.\nClear or hot, whichever suits you."},{"id":"n037","name":"라 칸티나","district":"중구","cuisine":"이탈리아","since":"1967","roadAddr":"서울특별시 중구 을지로 19","jibunAddr":"을지로1가 50","phone":"02-777-2579","source":"서울미래유산","romanName":"Ra Kantina","enDistrict":"Jung-gu","enCuisine":"Italian","enAddr":"19 Eulji-ro, Jung-gu, Seoul","enNameSrc":"romanized","story":"An Italian restaurant open since about 1967, in the same basement room on Euljiro.\nLa Cantina means a tavern, or a wine cellar.\nItalian ingredients and Italian cooks were both hard to come by at first — the Italian ambassador's wife taught them recipes — until a trained chef from the US military hotel in Yongsan and Walkerhill was brought in in 1982.\nIt was expensive enough that ordinary people rarely came: it was where matchmaking meetings were held, and it once kept suits to lend to diners who arrived without one."},{"id":"n038","name":"창성옥","district":"용산구","cuisine":"해장국","since":"1967","roadAddr":"서울특별시 용산구 새창로 124-10","jibunAddr":"용문동 25-16","phone":"027182878","source":"서울미래유산","romanName":"Changseongok","enDistrict":"Yongsan-gu","enCuisine":"Hangover soup","enAddr":"124-10 Saechang-ro, Yongsan-gu, Seoul","enNameSrc":"romanized","story":"A haejangguk house inside Yongmun Market, begun by a grandmother in the colonial years and handed on in 1967 to the couple who owned the building; three generations since.\nIt started at a stall selling fried eggs, when the market was still mostly open ground.\nOx neck bone simmers twenty-five hours, doenjang goes in for the seasoning, then cabbage, garlic and seonji — Seoul-style haejangguk, clean rather than heavy.\nThe fried egg is still on the menu and is what the place is known by; the doors stay open around the clock unless the pot runs dry first."},{"id":"n039","name":"무교동 북어국집","district":"중구","cuisine":"북어국","since":"1968","roadAddr":"서울특별시 중구 을지로1길 38","jibunAddr":"다동 173-0","phone":"02-777-3891","source":"서울미래유산","romanName":"Mugyodong Bugeogukjip","enDistrict":"Jung-gu","enCuisine":"Dried pollock soup","enAddr":"38 Eulji-ro 1-gil, Jung-gu, Seoul","enNameSrc":"romanized","story":"Opened around 1968 in Mugyo-dong and moved to Dadong in 1974 when the block was redeveloped; two generations.\nBeef bone is drawn down first, then dried pollack heads and bones go in, and the flame is adjusted over twelve hours to hold the broth gentle.\nSoaked rice is ground into it and rested another twelve hours, which takes the dryness and bitterness out of the fish.\nThe pollack and hwangtae come from the drying fields of Goseong in Gangwon; children eat free, and it has been one dish only since the founder's son took over in 1997."},{"id":"n040","name":"성북동 국시집","district":"성북구","cuisine":"국수","since":"1969","roadAddr":"서울특별시 성북구 창경궁로43길 9","jibunAddr":"성북동1가 9","phone":"02-762-1924","source":"서울미래유산","romanName":"Seongbukdong Guksijip","enDistrict":"Seongbuk-gu","enCuisine":"Noodles","enAddr":"9 Changgyeonggung-ro 43-gil, Seongbuk-gu, Seoul","enNameSrc":"romanized","story":"\"Guksi\" is the Gyeongsang word for noodles; the shop opened in 1969 and has not left the spot, now in its second generation.\nThe founder Lee Ok-man had been a teacher before the war and lost her husband in it, and was running a small snack shop on the ground floor when the mayor of Seoul stopped in during 1968 and told her the kalguksu was good enough to open on.\nKim Young-sam ate here long before he entered office, and the crowd that followed his kalguksu habit filled the room.\nFlour alone in the noodles, hanwoo brisket and shank, sun-dried chili, Uiseong garlic, and a beef broth of four hours — as her own grandmother made it in Andong."},{"id":"n041","name":"대문점","district":"영등포구","cuisine":"중식","since":"1968","roadAddr":"서울특별시 영등포구 영중로10길 30","jibunAddr":"영등포동3가 15-4","phone":"0226783256","source":"서울미래유산","romanName":"Daemunjeom","enDistrict":"Yeongdeungpo-gu","enCuisine":"Chinese","enAddr":"30 Yeongjung-ro 10-gil, Yeongdeungpo-gu, Seoul","enNameSrc":"romanized","story":"Fifty years of ohyangjangyuk and dumplings in a Yeongdeungpo market alley, open since 1968.\nThe founder was a hwagyo who left for the United States in 1972, and Kang Jeong-cheol, working there at the time, took the shop over and has run it since.\nThe whole menu is five kinds of dumpling, ohyangjangyuk and ohyang jokbal — no jjajangmyeon, no jjamppong, no tangsuyuk.\nChinese merchants began settling in Korea after 1882 and many of them lived in Yeongdeungpo; this shop is what remains of that."},{"id":"n042","name":"선천집","district":"종로구","cuisine":"한정식","since":"1971","roadAddr":"서울특별시 종로구 인사동14길 5","jibunAddr":"관훈동 100-4","phone":"0507-1368-5674","source":"서울미래유산","romanName":"Seoncheon","enDistrict":"Jongno-gu","enCuisine":"Korean set meal","enAddr":"5 Insadong 14-gil, Jongno-gu, Seoul","enNameSrc":"VisitSeoul","story":"Forty-odd years of hanjeongsik.\nThe table is built around Pyeongan-do cooking.\nTen to thirteen dishes come as standard — gujeolpan, hoe, soup and jjim, jeon, skewered bulgogi, jeyuk.\nAt lunch a shortened version of the same table is what most people order."},{"id":"n044","name":"중림장","district":"중구","cuisine":"설렁탕","since":"1972","roadAddr":"서울특별시 중구 청파로 459-1","jibunAddr":"중림동 468-0","phone":"02-392-7743","source":"서울미래유산","romanName":"Jungrimjang","enDistrict":"Jung-gu","enCuisine":"Ox-bone soup","enAddr":"459-1 Cheongpa-ro, Jung-gu, Seoul","enNameSrc":"romanized","story":"An Yeong-ja was in the wholesale fish trade when she opened Jungnimjang in 1972 to feed the traders around her.\nJungnim-dong then held the largest fish market in Seoul, before Noryangjin was built.\nThe seolleongtang is the Namdaemun kind — milky at first, clearing as the meat goes in — with marrow bone, knee cartilage, good brisket and oxtail steeped together.\nHer youngest son Kim Gyeong-ho took over in 2006 and spent a year and a half persuading her to add kkoritang; it is now what people order most in summer."},{"id":"n046","name":"림스치킨","district":"종로구","cuisine":"치킨","since":"1977","roadAddr":"서울특별시 종로구 대학로 143","jibunAddr":"혜화동 167-3","phone":"010-5890-3950","source":"서울미래유산","romanName":"Rimseuchikin","enDistrict":"Jongno-gu","enCuisine":"Fried chicken","enAddr":"143 Daehak-ro, Jongno-gu, Seoul","enNameSrc":"romanized","story":"Yu Seok-ho brought the American fried chicken idea home and opened in 1977 inside the Shinsegae main store in Myeongdong, half chicken shop and half beer hall.\nIn 1983 his ginseng-powder chicken took the gold medal in the food division of the New York international invention fair, and went on sale in Korea in 1991.\nBranches followed in Manhattan in 1990, Shanghai in 1993, and Yanji and Los Angeles in 2000 — the first chicken franchise the country had.\nWith the Myeongdong shop gone, the Hyehwa branch is the oldest left; it stands among the theatres and has become a meeting place for the people who work in them."},{"id":"n047","name":"옛날집 낙원아구찜","district":"종로구","cuisine":"아구찜","since":"1977","roadAddr":"서울특별시 종로구 삼일대로 436","jibunAddr":"낙원동 48","phone":"02-741-3621","source":"서울미래유산","romanName":"Yetnaljip Nagwonagujjim","enDistrict":"Jongno-gu","enCuisine":"Braised monkfish","enAddr":"436 Samil-daero, Jongno-gu, Seoul","enNameSrc":"romanized","story":"The first agujjim house in Nagwon-dong, and the reason the street is named for the dish.\nJeon Nak-bong and Yun Cheong-ja had sold agujjim in Masan through the 1960s and came up to Seoul in 1972; their son runs it now.\nSeoul did not know the dish, so they sent a Masan-born worker back home again and again to bring the taste north until they had it.\nSeoul agujjim thickens with starch, takes in miduduck and other seafood, and finishes as fried rice — which is where it parts from Masan."},{"id":"n048","name":"원대구탕","district":"용산구","cuisine":"대구탕","since":"1979","roadAddr":"서울특별시 용산구 한강대로62가길 8","jibunAddr":"한강로1가 142-4","phone":"02-797-4488","source":"서울미래유산","romanName":"Won Daegutang","enDistrict":"Yongsan-gu","enCuisine":"Cod soup","enAddr":"8 Hangang-daero 62ga-gil, Yongsan-gu, Seoul","enNameSrc":"VisitSeoul","story":"Thirty-odd years of daegutang — cod in a broth that is hot and clean at once.\nCod and vegetables are bought each morning and go into a pot that holds two hundred servings.\nThe broth has a reputation for settling a hangover.\nNo reservations are taken, so there is a line."},{"id":"n049","name":"동흥관","district":"금천구","cuisine":"중식","since":"1950","roadAddr":"서울특별시 금천구 시흥대로63길 20","jibunAddr":"시흥동 115 일대","phone":"02-803-3759","source":"서울미래유산","romanName":"Donghunkwan","enDistrict":"Geumcheon-gu","enCuisine":"Chinese","enAddr":"20 Siheung-daero 63-gil, Geumcheon-gu, Seoul","enNameSrc":"VisitSeoul","story":"Seventy years on one spot in Geumcheon, passed from a hwagyo father to his son and then his grandson.\nIt opened in 1951 while the war was still burning, and city records show the business registration issued in 1950 — the oldest for a Chinese restaurant in Seoul.\nThe kitchen is staffed entirely by Chinese and hwagyo chefs cooking in mainland and Taiwanese method, and every sauce is made in-house.\nJjajangmyeon, jjamppong and tangsuyuk anchor the menu, with dim sum as the signature; the shop is a designated Baengnyeon Gage."},{"id":"n050","name":"쌍다리식당","district":"성북구","cuisine":"돼지불백","since":"1986","roadAddr":"서울특별시 성북구 성북로23길 4","jibunAddr":"성북동 109-2","phone":"02-743-0325","source":"서울미래유산","romanName":"Ssangdarisikdang","enDistrict":"Seongbuk-gu","enCuisine":"Pork bulgogi","enAddr":"4 Seongbuk-ro 23-gil, Seongbuk-gu, Seoul","enNameSrc":"romanized","story":"It opened in 1970 as a drivers' canteen, grilling marinated pork over briquettes.\nSeongbuk-dong was out of the way then, and taxi and bus drivers were most of who could find it.\nPork neck and belly arrive from Majang-dong each morning, are worked through a marinade of garlic, ginger, pepper and sesame oil, and rest a day before they meet the charcoal.\nThe meat was seared in advance at a range in the corner so that drivers with no time to sit and grill could eat at once — which is what made it the drivers' canteen of Seoul."},{"id":"o001","name":"함스브로트과자점","district":"도봉구","cuisine":"베이커리","since":"1996","roadAddr":"서울특별시 도봉구 도봉로 483","jibunAddr":"서울 도봉구 쌍문동 88-106","phone":"02-996-4488","source":"오래가게","romanName":"Ham’s brot","enDistrict":"Dobong-gu","enCuisine":"Bakery","enAddr":"483 Dobong-ro, Dobong-gu, Seoul","enNameSrc":"VisitSeoul","story":"Since 1999 this has been the workshop of Korea's eighth certified master confectioner.\nIts bouquet cakes, decorated with Korean flowers, are what people come for.\nThe bread is raised with a natural starter rather than commercial yeast.\nBakery pilgrims treat it as a shrine, though it still keeps the character of an old neighborhood bakery."},{"id":"o002","name":"석교식당","district":"서대문구","cuisine":"순대국","since":"1986","roadAddr":"서울특별시 서대문구 통일로 185","jibunAddr":"서울특별시 서대문구 영천동 333 외 1필지(333-1) 1층 전체","phone":"02-363-2803","source":"오래가게","romanName":"Seokgyo Restaurant","enDistrict":"Seodaemun-gu","enCuisine":"Blood sausage soup","enAddr":"185 Tongil-ro, Seodaemun-gu, Seoul","enNameSrc":"VisitSeoul","story":"A sundaeguk house opened in 1986, now run by the second generation.\nIngredients are trimmed fresh each day and boiled four hours into a broth that runs clear without seasoning.\nThe rice is milled in Seosan, Chungnam, and carried up.\nOffice workers and market traders on weekdays; on weekends hikers down from Ansan and Inwangsan, with makgeolli."},{"id":"o003","name":"나폴레옹과자점","district":"성북구","cuisine":"베이커리","since":"1968","roadAddr":"서울특별시 성북구 성북로 7","jibunAddr":"서울 성북구 성북동1가 35-5","phone":"02-742-7421","source":"오래가게","romanName":"Napoleon Bakery","enDistrict":"Seongbuk-gu","enCuisine":"Bakery","enAddr":"7 Seongbuk-ro, Seongbuk-gu, Seoul","enNameSrc":"VisitSeoul","story":"Opened in 1968 in Seongbuk-gu and now run by the second generation.\nMany of Korea's pastry chefs trained here, and the shop shaped much of the country's baking trade.\nIn 2007, work covering over the Seongbukcheon stream moved it 100 meters to the entrance of Seongbuk-dong.\nThe ground floor is the bakery and the second floor a café; the shop is designated a Seoul Future Heritage site."},{"id":"o004","name":"만포면옥","district":"은평구","cuisine":"평양냉면·이북음식","since":"1987","roadAddr":"서울특별시 은평구 연서로 171","jibunAddr":"서울특별시 은평구 진관동 63 롯데몰 은평점 4층 5호","phone":"02-389-3917","source":"오래가게","romanName":"Manpo Myeonok","enDistrict":"Eunpyeong-gu","enCuisine":"Pyeongyang cold noodles","enAddr":"171 Yeonseo-ro, Eunpyeong-gu, Seoul","enNameSrc":"VisitSeoul","story":"Opened in 1972 and now in its third generation, serving Pyongyang naengmyeon and eobokjaengban.\nMeat broth with dongchimi added gives it depth and a cold clarity — a Pyeongan-do method rarely seen in Seoul.\nIt came down from the founder, who was from Pyeongan-do, to the present owner unchanged.\nNo franchise has ever been opened, so that the taste stays where it is."},{"id":"o005","name":"신안촌","district":"종로구","cuisine":"남도음식","since":"1986","roadAddr":"서울특별시 종로구 사직로12길 8","jibunAddr":"서울특별시 종로구 내자동 152 ,153,154-1,155-1 (1층)","phone":"02-725-7744","source":"오래가게","romanName":"Sinanchon","enDistrict":"Jongno-gu","enCuisine":"Southwestern Korean cuisine","enAddr":"8 Sajik-ro 12-gil, Jongno-gu, Seoul","enNameSrc":"VisitSeoul","story":"Cooking from Sinan in South Jeolla, served in a hanok.\nThe founder Lee Geum-sim built the menu out of ingredients from her home region.\nNakji-kkuri — live octopus grilled in sesame-oil marinade — and yeonpotang are the two dishes to know.\nThere are course meals with raw fish and soup as well."},{"id":"o006","name":"태극당","district":"중구","cuisine":"베이커리","since":"1946","roadAddr":"서울특별시 중구 동호로24길 7","jibunAddr":"","phone":"02-2279-3152","source":"오래가게","romanName":"Taegeukdang","enDistrict":"Jung-gu","enCuisine":"Bakery","enAddr":"7 Dongho-ro 24-gil, Jung-gu, Seoul","enNameSrc":"romanized","story":"A bakery in Seoul since 1946.\nThe founder, who had longed for liberation, named it Taegeukdang and took the rose of Sharon as its mark to carry the ideals of the nation.\nIt developed a wide range of breads and built its name as an old confectionery house.\nThe founder wanted it never to become a franchise, and the shop works to keep the taste from changing."},{"id":"o007","name":"신락원","district":"동대문구","cuisine":"중식","since":"1965","roadAddr":"서울특별시 동대문구 전농로20길 2","jibunAddr":"서울특별시 동대문구 전농동 60-32 1층","phone":"02-2244-0008","source":"오래가게","romanName":"Sinrakwon","enDistrict":"Dongdaemun-gu","enCuisine":"Chinese","enAddr":"2 Jeonnong-ro 20-gil, Dongdaemun-gu, Seoul","enNameSrc":"VisitSeoul","story":"The grandfather opened a Chinese restaurant called Allakjeong, and the family trade began there.\nThe father took it over; the son who followed renamed it Sinnagwon.\nBefore inheriting the shop eight years ago, the present owner had cooked Chinese food for the president and worked as a Chinese chef at major Korean hotels.\nThe stir-fried jjamppong called sinnangmyeon draws the orders, and the shop's nurungjitang meal kit is sold in supermarkets."},{"id":"o008","name":"피터팬1978","district":"서대문구","cuisine":"베이커리·카페","since":"1978","roadAddr":"서울특별시 서대문구 증가로 10","jibunAddr":"서울 서대문구 연희동 90-5","phone":"02-336-4775","source":"오래가게","romanName":"PeterPan 1978","enDistrict":"Seodaemun-gu","enCuisine":"Bakery & cafe","enAddr":"10 Jeungga-ro, Seodaemun-gu, Seoul","enNameSrc":"VisitSeoul","story":"Two generations and more than forty years of baking.\nThe bakers trained under French and Japanese craftsmen and use a natural starter brought from France.\nOrganic rye and unrefined sugar go into the dough.\nThe loaves carry odd names — \"Baby's Bottom,\" \"The Bread Jean Valjean Stole\" — and draw Korean and foreign customers alike."},{"id":"o009","name":"종로 은행나무집 시청점","district":"중구","cuisine":"소고기구이","since":"1986","roadAddr":"서울특별시 중구 세종대로22길 12","jibunAddr":"서울 종로구 관철동 33-3 2~3층","phone":"02-2277-2266","source":"오래가게","romanName":"Jongno Eunhaengnamujip","enDistrict":"Jung-gu","enCuisine":"Grilled beef","enAddr":"12 Sejong-daero 22-gil, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"A galbi house opened in 1986, serving marinated short ribs in the manner once eaten by Joseon nobility.\nThe marinade soaks deep, sweet enough that the smell reaches you before the plate does.\nThe founder took the name from a 150-year-old ginkgo tree standing beside the hanok that drew him to the site.\nIts service is known too — the head of one association told his staff to come here and learn from it."},{"id":"o010","name":"만나당","district":"강남구","cuisine":"떡,약과","since":"1963","roadAddr":"서울특별시 강남구 논현로175길 61","jibunAddr":"서울 강남구 신사동 550-9 1층 101호 만나당","phone":"0507-1327-3312","source":"오래가게","romanName":"Mannadang","enDistrict":"Gangnam-gu","enCuisine":"Rice cake shop","enAddr":"61 Nonhyeon-ro 175-gil, Gangnam-gu, Seoul","enNameSrc":"VisitSeoul","story":"A royal-court confectionery opened in 1991, where the master and his successor work side by side.\nThe signature is yakgwa, a honeyed pastry made here with grain syrup.\nThe recipes come down from the banquet tables of the palace and the aristocratic households.\nIt is the only shop in Seoul that makes and sells both court tteok and court hangwa."},{"id":"o011","name":"모퉁이집","district":"강남구","cuisine":"종합분식","since":"1988","roadAddr":"서울특별시 강남구 테헤란로1길 20","jibunAddr":"서울특별시 강남구 신사동 657-3","phone":"02-562-5948","source":"오래가게","romanName":"Motungi Jip","enDistrict":"Gangnam-gu","enCuisine":"Korean snack food","enAddr":"20 Teheran-ro 1-gil, Gangnam-gu, Seoul","enNameSrc":"VisitSeoul","story":"It has sat on the corner since the busy streets of Gangnam were still houses, which is where the name comes from.\nIt began as Somunnan Guksujip, selling anchovy noodles to students on their way to the reading room.\nTteok ramyeon and odeng gimbap sell best.\nWord has spread among foreign visitors that this is the ramyeon place in Gangnam, and they arrive with map apps and translators open."},{"id":"o014","name":"공항칼국수","district":"강서구","cuisine":"칼국수","since":"1979","roadAddr":"서울특별시 강서구 공항대로 18-1","jibunAddr":"서울특별시 강서구 공항동 49-1 외 8필지 이스카이오피스텔 (지하 1층)","phone":"02-2664-9748","source":"오래가게","romanName":"Gonghang Kalguksu","enDistrict":"Gangseo-gu","enCuisine":"Knife-cut noodles","enAddr":"18-1 Gonghang-daero, Gangseo-gu, Seoul","enNameSrc":"VisitSeoul","story":"Opened in 1979 and run for forty-five years across two generations, in front of Gimpo Airport.\nHanwoo broth simmered down, with a hot seasoning paste stirred through, makes the mushroom kalguksu people come for.\nFried rice made in what is left in the bowl is the second half of the meal.\nA meal kit lets you cook the same thing at home."},{"id":"o015","name":"등촌 최월선칼국수","district":"강서구","cuisine":"칼국수","since":"1984","roadAddr":"서울특별시 강서구 화곡로64길 68","jibunAddr":"서울 강서구 등촌동 654-95","phone":"02-3661-2744","source":"오래가게","romanName":"Deungchon Choewolseon Kalguksu","enDistrict":"Gangseo-gu","enCuisine":"Knife-cut noodles","enAddr":"68 Hwagok-ro 64-gil, Gangseo-gu, Seoul","enNameSrc":"VisitSeoul","story":"A small house in a residential alley, with \"kalguksu\" and \"mushroom maeuntang\" painted roughly above an old door.\nMushroom maeuntang is the only meal on the menu.\nOrder it and kalguksu and fried rice arrive alongside, which makes a generous meal for the price.\nThe pot is thick with garlic, oyster mushrooms, and minari, and the noodles are plump — closer to udon than to kalguksu."},{"id":"o017","name":"미림분식","district":"관악구","cuisine":"떡볶이","since":"1986","roadAddr":"서울특별시 관악구 호암로 553","jibunAddr":"서울 관악구 신림동 298-3","phone":"02-888-8567","source":"오래가게","romanName":"Mirim Bunsik","enDistrict":"Gwanak-gu","enCuisine":"Tteokbokki","enAddr":"553 Hoam-ro, Gwanak-gu, Seoul","enNameSrc":"VisitSeoul","story":"A tteokbokki shop that has stood beside Mirim Girls' High School since 1988.\nThere is no proper sign, and little about it has changed.\nThe signature is instant tteokbokki, built to order with glass noodles, dumplings, ramyeon, or fish cake.\nThe actor Sol Kyung-gu ate tteokbokki here in the film \"The Merciless,\" and some visitors come for that."},{"id":"o018","name":"휘가로","district":"관악구","cuisine":"호프집","since":"1987","roadAddr":"서울특별시 관악구 신림로11길 20","jibunAddr":"서울특별시 관악구 신림동 241-24 지하1층","phone":"02-889-1722","source":"오래가게","romanName":"Figaro","enDistrict":"Gwanak-gu","enCuisine":"Beer pub","enAddr":"20 Sillim-ro 11-gil, Gwanak-gu, Seoul","enNameSrc":"VisitSeoul","story":"A hof on Nokdu-geori, the exam district beside Seoul National University.\nStudents used to say you were not an SNU student if you did not know it.\nPrices stayed low, which mattered to students and exam-takers with nothing in their pockets.\nDuring the student movement years protesters hid here, and it was where they came to let the anger settle."},{"id":"o021","name":"경기떡집","district":"마포구","cuisine":"떡집","since":"1958","roadAddr":"서울특별시 마포구 동교로9길 24","jibunAddr":"서울특별시 마포구 망원동 378-7","phone":"02-333-8880","source":"오래가게","romanName":"Gyeonggi Tteokjip","enDistrict":"Mapo-gu","enCuisine":"Rice cake shop","enAddr":"24 Donggyo-ro 9-gil, Mapo-gu, Seoul","enNameSrc":"VisitSeoul","story":"The shop started in 1958 at the Heungin mill in Jongno and carries on now in Mangwon-dong.\nThe founder's sons run it, the second generation, and one of them holds the title of youngest master of tteok.\nThe signature is the \"E.T. tteok,\" a northern-style injeolmi wrapped around with bean paste.\nThe aim is to hold the tradition while making tteok a dessert light enough for the way people eat now."},{"id":"o022","name":"굴다리식당","district":"마포구","cuisine":"김치찌개","since":"2001","roadAddr":"서울특별시 마포구 새창로 8-1","jibunAddr":"서울특별시 마포구 도화동 181-45 1층","phone":"02-712-0066","source":"오래가게","romanName":"Guldarisikdang","enDistrict":"Mapo-gu","enCuisine":"Kimchi stew","enAddr":"8-1 Saechang-ro, Mapo-gu, Seoul","enNameSrc":"romanized","story":"Open in Mapo since 1993, named for the underpass by Gongdeok Station that has since been torn down.\nIt began with naengmyeon, seolleongtang and much else on the menu.\nA kimchi jjigae made at the request of broadcast staff took over, and that is what it has been known for since.\nPortions run generous enough that one serving arrives looking like two."},{"id":"o023","name":"다락","district":"마포구","cuisine":"떡볶이","since":"1981","roadAddr":"서울특별시 마포구 도화2길 8","jibunAddr":"서울특별시 마포구 도화동 340-0","phone":"02-706-0519","source":"오래가게","romanName":"Darak","enDistrict":"Mapo-gu","enCuisine":"Tteokbokki","enAddr":"8 Dohwa 2-gil, Mapo-gu, Seoul","enNameSrc":"VisitSeoul","story":"Famous across Seoul for jeukseok tteokbokki cooked at the table, and introduced on television as a master of the dish.\nIt comes two ways, on a tray or as a hotpot, with extra sides to add beyond the basic ingredients.\nThe walls are filled with the names of customers who came and the dates of their visits.\nGenerous but cheap, plain but familiar — that is what the years here have been spent sharing."},{"id":"o024","name":"사하라","district":"마포구","cuisine":"라이브 주점","since":"","roadAddr":"서울특별시 마포구 만리재로 15","jibunAddr":"서울특별시 마포구 공덕동 256-13 제일빌딩 1층동 2호호","phone":"02-719-8338","source":"오래가게","romanName":"Sahara","enDistrict":"Mapo-gu","enCuisine":"Live music bar","enAddr":"15 Mallijae-ro, Mapo-gu, Seoul","enNameSrc":"VisitSeoul","story":"Everything changes except the Sahara — that thought gave this live bar its name and its intent to hold a life's worth of stories.\nDuring the democracy movement it opened its floor to student protesters who needed somewhere to hide.\nThose students still come, grown now.\nIt works as a sarangbang as much as a bar: strangers fall into laughter, and people who arrive alone do not stay alone."},{"id":"o027","name":"가미분식","district":"서대문구","cuisine":"분식","since":"1975","roadAddr":"서울특별시 서대문구 이화여대8길 2","jibunAddr":"서울특별시 서대문구 대현동 54-1 무궁화상가아파트","phone":"02-364-3948","source":"오래가게","romanName":"Gami Bunsik","enDistrict":"Seodaemun-gu","enCuisine":"Korean snack food","enAddr":"2 Ewhayeodae 8-gil, Seodaemun-gu, Seoul","enNameSrc":"VisitSeoul","story":"A bunsik shop by Ewha station, running since 1975.\nGraduates in middle age come back for the memory; younger customers come because it was their mother's place.\nThe gami udon is flour and salt only, boiled twice, the round noodles soft and springy.\nUdon and a rice ball make a meal; the doors open at 11:30 and there is already a queue taking numbers."},{"id":"o028","name":"독수리다방","district":"서대문구","cuisine":"다방·커피","since":"1971","roadAddr":"서울특별시 서대문구 연세로 36","jibunAddr":"서울 서대문구 창천동 31-4","phone":"02-363-1222","source":"오래가게","romanName":"Dok-Dabang","enDistrict":"Seodaemun-gu","enCuisine":"Tearoom & coffee","enAddr":"36 Yonsei-ro, Seodaemun-gu, Seoul","enNameSrc":"VisitSeoul","story":"Through the 1970s and 80s this was where students from the nearby universities met and argued.\nIt began as a music tearoom and was a favorite of writers, among them Seong Seok-je and the poet Ki Hyeong-do.\nIt closed in 2005 as coffee shops took over, then reopened in 2013 under the grandson of the founder.\nThe old message board and photographs from its earlier decades are still on the walls."},{"id":"o029","name":"청송본관함흥냉면","district":"서대문구","cuisine":"냉면(함흥)","since":"","roadAddr":"서울특별시 서대문구 연희맛로 6","jibunAddr":"","phone":"02-334-3545","source":"오래가게","romanName":"Cheongsongbongwanhamheungnaengmyeon","enDistrict":"Seodaemun-gu","enCuisine":"Hamhung cold noodles","enAddr":"6 Yeonhuimat-ro, Seodaemun-gu, Seoul","enNameSrc":"romanized","story":"The owner's mother ran a naengmyeon house in Busan, where she had fled during the Korean War.\nThe present owner took over her philosophy and her technique, and started the shop from there.\nThe taste has not changed over the years, and anyone living nearby knows the place.\nThe dish to order is hoe-naengmyeon, piled with aged coastal flounder."},{"id":"o030","name":"평택 고여사집 냉면","district":"서대문구","cuisine":"냉면(평양)","since":"1974","roadAddr":"서울특별시 서대문구 연희로 81-9","jibunAddr":"서울특별시 서대문구 연희동 193-13 (지상1층)","phone":"02-392-7461","source":"오래가게","romanName":"Pyeongtaek Go Yeosa House Cold Noodles","enDistrict":"Seodaemun-gu","enCuisine":"Cold noodles","enAddr":"81-9 Yeonhui-ro, Seodaemun-gu, Seoul","enNameSrc":"VisitSeoul","story":"The founder came south from Pyeongan-do during the Korean War, carried on his father's naengmyeon trade, and opened in Pyeongtaek in 1974 as \"Pyeongtaek Go Baksa-jip.\"\nThe name came from a nickname — friends called him \"Hey, Dr. Go\" for his open temper.\nIt moved to Sinchon in 1982, and the founder's daughter Go Hui-seung moved it again to Yeonhui-dong in 2008, where it stands now.\nCold broth and firm noodles, with shredded oi-gochu laid over the top, which is how it is eaten here."},{"id":"o032","name":"서우제과","district":"서초구","cuisine":"제과·디저트","since":"1980","roadAddr":"서울특별시 서초구 강남대로30길 48-2","jibunAddr":"서울 서초구 양재동 18-3","phone":"02-522-5633","source":"오래가게","romanName":"Seowoo Bakery","enDistrict":"Seocho-gu","enCuisine":"Confectionery & desserts","enAddr":"48-2 Gangnam-daero 30-gil, Seocho-gu, Seoul","enNameSrc":"VisitSeoul","story":"The smell of puffed rice has not left this shop since 1980.\nA father who had sold ppeongtwigi and a son trained in mechanical engineering and physics developed a nurungji cracker together.\nPuffed rice is coated in garlic-baguette or condensed-milk flavor — now the shop's best seller.\nCustomers say the same thing: this is what puffed rice is supposed to taste like."},{"id":"o033","name":"라플루마앤보헤미안","district":"성북구","cuisine":"카페·드립커피","since":"","roadAddr":"서울특별시 성북구 고려대로27길 18","jibunAddr":"서울 성북구 안암동5가 12-71","phone":"02-927-7949","source":"오래가게","romanName":"La Pluma & Bohemian","enDistrict":"Seongbuk-gu","enCuisine":"Drip coffee house","enAddr":"18 Goryeodae-ro 27-gil, Seongbuk-gu, Seoul","enNameSrc":"VisitSeoul","story":"Drip coffee in Korea started here, and the house has been pouring since 1990.\nIt is run now by a disciple of Park Yi-chu, one of the country's first-generation baristas.\nThe cup it is known for is a Geisha varietal from the Ethiopian forest.\nBright acidity, an unusual aroma, and a cup worth sitting with."},{"id":"o034","name":"봉화묵집","district":"성북구","cuisine":"묵밥·만두","since":"1982","roadAddr":"서울특별시 성북구 아리랑로19길 46-2","jibunAddr":"서울특별시 성북구 정릉동 488-1","phone":"02-918-1668","source":"오래가게","romanName":"Bonghwa Mukjip","enDistrict":"Seongbuk-gu","enCuisine":"Acorn jelly rice soup","enAddr":"46-2 Arirang-ro 19-gil, Seongbuk-gu, Seoul","enNameSrc":"VisitSeoul","story":"Beside Jeongneung since 1982, known for mukbap and dumplings.\nThe trade passed from a mother-in-law from Bonghwa in Gyeongbuk to her daughter-in-law.\nDoenjang and soy sauce are made in-house, on a stated principle of never deceiving a customer with food.\nIt is an old house converted, and eating here feels like eating at someone's home."},{"id":"o035","name":"명가떡집","district":"송파구","cuisine":"떡집·디저트","since":"1937","roadAddr":"서울특별시 송파구 석촌호수로12길 7","jibunAddr":"서울 송파구 잠실동 210","phone":"02-416-9669","source":"오래가게","romanName":"Myungga Tteokjip","enDistrict":"Songpa-gu","enCuisine":"Rice cake shop","enAddr":"7 Seokchonhosu-ro 12-gil, Songpa-gu, Seoul","enNameSrc":"VisitSeoul","story":"A rice-cake shop since 1980, now in its third generation, working from a recipe left by the owner's aunt.\nThe owner was fourteen when the father died and began making tteok alongside the mother.\nPreparation starts at two in the morning, by the old methods.\nThe red bean filling rests 24 hours with radish and mulberry leaf, then boils for eight; the chapssaltteok is the best known."},{"id":"o036","name":"삼우치킨센타","district":"영등포구","cuisine":"치킨·호프","since":"1972","roadAddr":"서울특별시 영등포구 시흥대로 671","jibunAddr":"서울특별시 영등포구 대림동 960-4","phone":"02-844-9292","source":"오래가게","romanName":"Samu Chicken Center","enDistrict":"Yeongdeungpo-gu","enCuisine":"Fried chicken","enAddr":"671 Siheung-daero, Yeongdeungpo-gu, Seoul","enNameSrc":"VisitSeoul","story":"A whole-chicken shop opened by the father in 1972 and taken over by the son.\nThe taste reaches the generation that grew up in the 70s and 80s, and some families are now on their third generation of customers.\nThe interior of that time has been left as it was.\nIngredients are trimmed daily, the pickled radish is made in-house, and the fried and electric-roast chicken have not changed."},{"id":"o038","name":"김용안과자점","district":"용산구","cuisine":"제과·전병","since":"1967","roadAddr":"서울특별시 용산구 한강대로 155-1","jibunAddr":"서울 용산구 한강로2가 259-1","phone":"02-796-6345","source":"오래가게","romanName":"Kim Yong-an Patisserie","enDistrict":"Yongsan-gu","enCuisine":"Confectionery & desserts","enAddr":"155-1 Hangang-daero, Yongsan-gu, Seoul","enNameSrc":"VisitSeoul","story":"A jeonbyeong wafer shop in Samgakji, working since 1967.\nThe cookie irons that founder Kim Yong-an worked out are still the ones in use.\nThe style traces back to Japanese-era confectionery, remade here into something of its own.\nFather to son since it opened, still turning out thin, crisp wafers that smell of egg."},{"id":"o039","name":"서부감자국","district":"은평구","cuisine":"감자탕","since":"","roadAddr":"서울특별시 은평구 서오릉로 8","jibunAddr":"서울 은평구 녹번동 181","phone":"02-356-4555","source":"오래가게","romanName":"Seobu Gamjaguk","enDistrict":"Eunpyeong-gu","enCuisine":"Pork-bone potato stew","enAddr":"8 Seooreung-ro, Eunpyeong-gu, Seoul","enNameSrc":"VisitSeoul","story":"When Eungam-dong still had its slaughterhouse, gamjatang was what the restaurants around it were known for.\nThis one stayed on the same spot after the others closed.\nThe soup is built on carefully trimmed pork spine — clean rather than heavy — and the kimchi beside it has its own reputation.\nKimchi is made daily, with a separate batch kept for the fried rice, and in winter a plate of raw oysters appears."},{"id":"o040","name":"코스모스 분식","district":"은평구","cuisine":"분식(즉석떡볶이)","since":"1977","roadAddr":"서울특별시 은평구 연서로15길 2","jibunAddr":"서울특별시 은평구 구산동 1-16","phone":"02-358-6623","source":"오래가게","romanName":"Cosmos Snack Bar","enDistrict":"Eunpyeong-gu","enCuisine":"Korean snack food","enAddr":"2 Yeonseo-ro 15-gil, Eunpyeong-gu, Seoul","enNameSrc":"VisitSeoul","story":"A bunsik shop near Gusan Station that has held the same spot for over 40 years.\nThe draw is sweet tteokbokki cooked right at your table — the taste of school days.\nThe interior has been left as it was: nostalgia for older diners, novelty for younger ones.\nIn the 1990s the singer Kim Jang-hoon ran a DJ booth here, taking requests from customers."},{"id":"o041","name":"태조대림감자국","district":"은평구","cuisine":"감자탕","since":"1932","roadAddr":"서울특별시 은평구 응암로 172","jibunAddr":"서울 은평구 응암동 603-74","phone":"02-306-6535","source":"오래가게","romanName":"Taejo Daerim Gamjaguk","enDistrict":"Eunpyeong-gu","enCuisine":"Pork-bone potato stew","enAddr":"172 Eungam-ro, Eunpyeong-gu, Seoul","enNameSrc":"VisitSeoul","story":"The first gamjaguk house on Eungam-dong's gamjaguk street, standing at its entrance.\nIt took its name from Taejo Yi Seong-gye, founding king of Joseon, to mark that.\nMost of Korea says \"gamjatang,\" but on this street it is \"gamjaguk\" — the owner Bae Ik-hun proposed the humbler word and the neighboring shops took it up.\nIt is the only place on the street open around the clock, a promise kept to its late-night regulars."},{"id":"o042","name":"가봉루","district":"종로구","cuisine":"중식(한국식 중식)","since":"","roadAddr":"서울특별시 종로구 새문안로5길 5-27","jibunAddr":"서울특별시 종로구 당주동 168 당주빌딩","phone":"02-736-8100","source":"오래가게","romanName":"Gabongnu","enDistrict":"Jongno-gu","enCuisine":"Chinese","enAddr":"5-27 Saemunan-ro 5-gil, Jongno-gu, Seoul","enNameSrc":"VisitSeoul","story":"Korean-Chinese cooking with more than fifty years behind it.\nThe room is plain and the mood belongs to an earlier time.\nIngredients go in without stinting, with the emphasis on getting the basics right.\nThe gogi twigim — fried meat seasoned with only salt and pepper — is rare elsewhere and is the dish here; the jjamppong, tangsuyuk and jjajangmyeon hold up too."},{"id":"o044","name":"낙원떡집","district":"종로구","cuisine":"떡집(궁중떡)","since":"1912","roadAddr":"서울특별시 종로구 삼일대로 438","jibunAddr":"서울 종로구 낙원동 9","phone":"02-732-5579","source":"오래가게","romanName":"Nagwon Rice Cake","enDistrict":"Jongno-gu","enCuisine":"Rice cake shop","enAddr":"438 Samil-daero, Jongno-gu, Seoul","enNameSrc":"VisitSeoul","story":"Three generations and a century of rice cakes, since the 1920s.\nThe technique came from a court lady who had left palace service at Wonseo-dong.\nEvery cake is still shaped by hand.\nThe dutteoptteok is what it is known for, and the shop is designated a Seoul Future Heritage site."},{"id":"o045","name":"내자땅콩","district":"종로구","cuisine":"땅콩전병","since":"","roadAddr":"서울특별시 종로구 사직로 111","jibunAddr":"서울 종로구 내자동 21-1","phone":"02-730-7239","source":"오래가게","romanName":"Naeja Peanuts","enDistrict":"Jongno-gu","enCuisine":"Peanut wafers","enAddr":"111 Sajik-ro, Jongno-gu, Seoul","enNameSrc":"VisitSeoul","story":"The current owner's father opened the shop at twenty-six, some fifty years ago, after learning peanut wafers from a relative.\nThe press that makes them sits just inside, facing you as you come through the door.\nLittle has changed but the fire — briquettes gave way to gas.\nAbout 130 bags are made a day, and the laver and ginger wafers sell well too."},{"id":"o048","name":"비원떡집","district":"종로구","cuisine":"떡집(궁중떡)","since":"1949","roadAddr":"서울특별시 종로구 북촌로 33-1","jibunAddr":"서울 종로구 가회동 163","phone":"02-765-4928","source":"오래가게","romanName":"Biwon Tteokjip","enDistrict":"Jongno-gu","enCuisine":"Rice cake shop","enAddr":"33-1 Bukchon-ro, Jongno-gu, Seoul","enNameSrc":"VisitSeoul","story":"It opened in 1949 as \"Grandmother Hong's tteok shop,\" in the unsettled years after liberation.\nHan Hui-sun, the last holder of Joseon court cuisine, saw Hong Gan-nan's tteok at Nakseonjae in Changdeokgung and taught her the court recipes herself.\nThe shop began in a house near the palace and follows those same recipes today.\nFrom selecting the ingredients to shaping the cakes, all of it is done by hand."},{"id":"o050","name":"삼청동 수제비","district":"종로구","cuisine":"수제비","since":"1982","roadAddr":"서울특별시 종로구 삼청로 101-1","jibunAddr":"","phone":"02-735-2965","source":"오래가게","romanName":"Samcheongdong Sujebi","enDistrict":"Jongno-gu","enCuisine":"Hand-torn noodle soup","enAddr":"101-1 Samcheong-ro, Jongno-gu, Seoul","enNameSrc":"romanized","story":"Started as a small snack shop in Samcheong-dong in the 1980s under the owner Han Gi-yeong, where sujebi torn by hand at customers' request made the name.\nIt opened as a sujebi house proper in 1982.\nUnlike other sujebi houses, it comes to the table in an earthenware pot.\nPotato, young squash and dried laver go on top — few ingredients, a clean and nutty taste."},{"id":"o051","name":"손가네닭한마리","district":"종로구","cuisine":"닭한마리","since":"1960","roadAddr":"서울특별시 종로구 종로66가길 10","jibunAddr":"서울 종로구 숭인동 201-13","phone":"02-2234-9065","source":"오래가게","romanName":"Songane Dakhanmari","enDistrict":"Jongno-gu","enCuisine":"Whole chicken soup","enAddr":"10 Jong-ro 66ga-gil, Jongno-gu, Seoul","enNameSrc":"VisitSeoul","story":"A dak-hanmari house — a whole chicken simmered with vegetables, a Seoul dish.\nYou dip the meat in sauce, mild or hot as you like, then add kalguksu or rice porridge to what is left in the pot.\nThe founder had run a baekban house in Cheonggyecheon and added dak-hanmari at a regular's urging, until it became the only thing served.\nMultilingual menus and a printed guide to eating it make the place easy for visitors."},{"id":"o052","name":"순희네반찬","district":"종로구","cuisine":"젓갈, 게장,각종 반찬","since":"","roadAddr":"서울특별시 종로구 창경궁로 88","jibunAddr":"","phone":"02-2279-1885","source":"오래가게","romanName":"Sunhuinebanchan","enDistrict":"Jongno-gu","enCuisine":"Side dishes & salted seafood","enAddr":"88 Changgyeonggung-ro, Jongno-gu, Seoul","enNameSrc":"romanized","story":"The owner started selling banchan from a street stall after her older brother's business failed.\nThe kimchi and gejang from that stall spread by word of mouth, and she opened the first banchan shop inside Gwangjang Market.\nThe name comes from her eldest daughter, Sunhui.\nEveryone uses the name Sunhui now, but the original one in Gwangjang Market is this shop, and the owner takes pride in that."},{"id":"o054","name":"학림다방","district":"종로구","cuisine":"다방","since":"1956","roadAddr":"서울특별시 종로구 대학로 119","jibunAddr":"","phone":"02-742-2877","source":"오래가게","romanName":"Haknimdabang","enDistrict":"Jongno-gu","enCuisine":"Tearoom & coffee","enAddr":"119 Daehak-ro, Jongno-gu, Seoul","enNameSrc":"romanized","story":"A coffee house open since 1956, still in the same room on Daehak-ro.\nIt stood close enough to Seoul National University in its Hyehwa-dong years to be called the twenty-fifth lecture hall of the liberal arts college, and the college festival took its name from the shop.\nIn 1981 the National Democratic Student Alliance held its first meeting here, which is how the Hangnim incident got its name.\nWriters, painters, actors and musicians grew up in it — the poet Kim Ji-ha gave the shop as his own address when he began publishing — and Lee Chung-ryeol, a photographer, has run it since 1987."},{"id":"o055","name":"효자베이커리","district":"종로구","cuisine":"베이커리","since":"1948","roadAddr":"서울특별시 종로구 필운대로 54","jibunAddr":"서울 종로구 통인동 43-1","phone":"02-736-7629","source":"오래가게","romanName":"Hyoja Bakery","enDistrict":"Jongno-gu","enCuisine":"Bakery","enAddr":"54 Pirundae-ro, Jongno-gu, Seoul","enNameSrc":"VisitSeoul","story":"Down the alley past Cheong Wa Dae, next to Tongin Market.\nBaking since 1987 — the first bakery in Seochon — with a sign as old-fashioned as the name.\nSweet buns, doughnuts and croquettes sit beside fermented loaves and bagels.\nIt is known well enough that weekends sell out."},{"id":"o056","name":"남도한식 정든님","district":"중구","cuisine":"남도음식","since":"","roadAddr":"서울특별시 중구 세종대로14길 22-5","jibunAddr":"서울 중구 북창동 79","phone":"02-775-0038","source":"오래가게","romanName":"Namdohansik Jeongdeunnim","enDistrict":"Jung-gu","enCuisine":"Southwestern Korean cuisine","enAddr":"22-5 Sejong-daero 14-gil, Jung-gu, Seoul","enNameSrc":"romanized","story":"A Namdo home-cooking house known for Beolgyo cockles, braised silver pomfret and soy-marinated crab.\nSeafood is brought in from the south coast — maesaengi seaweed, tonguefish, rockfish and abalone.\nThe signature is a full-course hanjeongsik, the whole table set at once.\nIt stands across from Exit 8 by City Hall, and office workers and families make up most of the room."},{"id":"o057","name":"남포면옥","district":"중구","cuisine":"냉면","since":"1980","roadAddr":"서울특별시 중구 을지로3길 24","jibunAddr":"서울특별시 중구 다동 125 지상1층","phone":"02-757-2269","source":"오래가게","romanName":"Nampomyeonok","enDistrict":"Jung-gu","enCuisine":"Cold noodles","enAddr":"24 Eulji-ro 3-gil, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"Opened in 1972 by Gwak Bong-sun of Jinnampo in Pyeongan-do, who settled in Seoul after the Korean War; the third generation runs it now.\nDongchimi is buried in the ground to ferment, in the Pyeongan-do way, and becomes the broth.\nPresidents have come here for the naengmyeon.\nSome of the seating is traditional floor tables, if you want to eat that way."},{"id":"o058","name":"명동함흥면옥","district":"중구","cuisine":"함흥냉면","since":"1949","roadAddr":"서울특별시 중구 명동10길 35-19","jibunAddr":"서울특별시 중구 명동2가 26-1 1층.2층","phone":"02-776-8430","source":"오래가게","romanName":"Myeongdong Hamheung Myeonok","enDistrict":"Jung-gu","enCuisine":"Hamhung cold noodles","enAddr":"35-19 Myeongdong 10-gil, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"It began in Myeongdong in the late 1970s.\nGood interiors, air conditioning and food to match made it a favorite of the critics and artists known then as the Myeongdong set.\nThe first owners were a couple from Hwanghae-do, and the Hamgyong-style hoe naengmyeon is what it is known for.\nSpicy raw fish, and a dressing built from more than thirty fresh ingredients."},{"id":"o060","name":"성원전주콩나물국밥","district":"중구","cuisine":"콩나물국밥","since":"1937","roadAddr":"서울특별시 중구 명동10길 19-10","jibunAddr":"서울 중구 명동2가 4-1","phone":"02-777-4284","source":"오래가게","romanName":"Seongwon Jeonju Kongnamul Gukbap","enDistrict":"Jung-gu","enCuisine":"Bean sprout rice soup","enAddr":"19-10 Myeongdong 10-gil, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"Opened in 1937 by Kim So-seon, who started the restaurant to feed a family through wartime upheaval.\nJeonju-style kongnamul gukbap — bean sprout soup with rice — served in Myeongdong ever since.\nA crisp kimchi pancake comes before the meal.\nThe menu is printed in several languages, so visitors from abroad manage easily."},{"id":"o061","name":"을지다방","district":"중구","cuisine":"다방·쌍화차","since":"1929","roadAddr":"서울특별시 중구 을지로 124-1","jibunAddr":"서울 중구 을지로3가 315-3","phone":"02-2272-1886","source":"오래가게","romanName":"Eulji Dabang","enDistrict":"Jung-gu","enCuisine":"Tearoom & coffee","enAddr":"124-1 Eulji-ro, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"Opened in 1985, an old-style dabang left standing among the office towers.\nThe owner keeps one rule: never play games with what people eat.\nThe ssanghwacha arrives with an egg yolk floating in it like a full moon, explained to anyone meeting it for the first time.\nNewcomers tend to become regulars on the strength of that first cup."},{"id":"o062","name":"장수갈비집본가","district":"중구","cuisine":"소갈비","since":"1968","roadAddr":"
