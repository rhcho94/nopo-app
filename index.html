서울특별시 중구 명동2길 54-1","jibunAddr":"서울 중구 충무로1가 25-45 25-45","phone":"02-775-9292","source":"오래가게","romanName":"Jangsu Galbijip Bonga","enDistrict":"Jung-gu","enCuisine":"Grilled beef ribs","enAddr":"54-1 Myeongdong 2-gil, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"It opened in 1968 near the Savoy Hotel in Myeongdong, grilling over straw in a plain way at first.\nThe sweet marinade came from something the founder tasted while travelling in Japan.\nCrowds followed, and it grew into one of the highest-grossing restaurants in the country.\nThe ribs are tender and carry the smell of charcoal, and can be ordered as a single portion."},{"id":"o063","name":"하동관","district":"중구","cuisine":"곰탕","since":"1939","roadAddr":"서울특별시 중구 명동9길 12","jibunAddr":"서울특별시 중구 명동1가 10-4","phone":"02-776-5656","source":"오래가게","romanName":"Hadonggwan","enDistrict":"Jung-gu","enCuisine":"Beef bone soup","enAddr":"12 Myeongdong 9-gil, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"A gomtang house opened in Suha-dong in 1939, now in its third generation.\nIt keeps the founder's rules: no evening service, no delivery, and the doors close once the day's pot is sold.\nTwo items only — gomtang and suyuk — from good beef simmered long, in the clean Seoul style.\nIt is still served in traditional brassware, and it was selected for the Michelin Guide in 2025."},{"id":"o064","name":"동부고려제과","district":"중랑구","cuisine":"베이커리","since":"1974","roadAddr":"서울특별시 중랑구 망우로 388","jibunAddr":"서울 중랑구 망우동 563","phone":"02-433-1783","source":"오래가게","romanName":"Dongbu Goryeo Bakery","enDistrict":"Jungnang-gu","enCuisine":"Bakery","enAddr":"388 Mangu-ro, Jungnang-gu, Seoul","enNameSrc":"VisitSeoul","story":"Baking since 1974, on the principle that bread should taste good rather than look good.\nIt kept a habit from the 1970s, when bakeries near the racetrack were run like small supermarkets, and the shop still looks that way.\nManju and fresh doughnuts sit alongside garlic cream buns and ciabatta.\nThe owner credits natural fermentation, which makes the bread sit lightly, for keeping people coming back."},{"id":"o065","name":"잉꼬네떡볶이","district":"중랑구","cuisine":"떡볶이","since":"1978","roadAddr":"서울특별시 중랑구 용마산로120길 43","jibunAddr":"","phone":"02-2207-3603","source":"오래가게","romanName":"Ingkko Tteokbokki","enDistrict":"Jungnang-gu","enCuisine":"Tteokbokki","enAddr":"43 Yongmasan-ro 120-gil, Jungnang-gu, Seoul","enNameSrc":"VisitSeoul","story":"Making the same tteokbokki in Mangu-dong since 1978.\nIt goes back to when seven schools stood nearby and a row of tteokbokki carts fed them.\nThe recipe passed from mother-in-law to daughter-in-law and now to a son — three generations.\nNothing is added beyond what the first owner taught, and it still tastes the way it did outside the school gate."},{"id":"o067","name":"수유어묵공장","district":"강북구","cuisine":"어묵","since":"1974","roadAddr":"서울특별시 강북구 도봉로67길 18","jibunAddr":"","phone":"02-980-7488","source":"오래가게","romanName":"Suyu Fish Cake Factory","enDistrict":"Gangbuk-gu","enCuisine":"Fish cakes","enAddr":"18 Dobong-ro 67-gil, Gangbuk-gu, Seoul","enNameSrc":"VisitSeoul","story":"The owner had been a fish-cake factory foreman before opening this small stall in Suyu Market.\nHis son works beside him now, learning the trade.\nHe weighs the fish paste against the day's weather before mixing it.\nThe bars sell steadily, but the square vegetable cakes — fussy and hard to make — are why people come."},{"id":"o068","name":"애플하우스","district":"동작구","cuisine":"즉석떡볶이","since":"1989","roadAddr":"서울특별시 동작구 동작대로27다길 29","jibunAddr":"서울 동작구 사당동 138-4","phone":"02-595-1629","source":"오래가게","romanName":"Apple House","enDistrict":"Dongjak-gu","enCuisine":"Table-cooked tteokbokki","enAddr":"29 Dongjak-daero 27da-gil, Dongjak-gu, Seoul","enNameSrc":"VisitSeoul","story":"It began in 1987 as a street cart in Banpo and moved indoors as word spread.\nRedevelopment pushed it from Banpo to Isu in 2022.\nThe owner is passing the recipes to a daughter, the second generation.\nRegulars say the taste has not changed, and younger customers come looking for exactly that."},{"id":"o069","name":"터방내","district":"동작구","cuisine":"카페(드립·원두)","since":"1983","roadAddr":"서울특별시 동작구 흑석로 101-7","jibunAddr":"서울 동작구 흑석동 184-19","phone":"02-813-4434","source":"오래가게","romanName":"Teobangnae","enDistrict":"Dongjak-gu","enCuisine":"Drip coffee house","enAddr":"101-7 Heukseok-ro, Dongjak-gu, Seoul","enNameSrc":"VisitSeoul","story":"Since 1983, known in the neighborhood as \"Jungdae Dabang,\" a Heukseok-dong café built on siphon coffee.\nThe 1980s interior has been left alone.\nCustomers who were young then sit among younger ones who came for the feel of it.\nSiphon is an old method of extraction, roasted differently for each bean, and the prices here have stayed low for years."},{"id":"o070","name":"원조조박집","district":"마포구","cuisine":"돼지갈비","since":"1979","roadAddr":"서울특별시 마포구 토정로 313-1","jibunAddr":"서울특별시 마포구 용강동 40-1","phone":"02-712-7462","source":"오래가게","romanName":"Original Jobak House","enDistrict":"Mapo-gu","enCuisine":"Pork ribs","enAddr":"313-1 Tojeong-ro, Mapo-gu, Seoul","enNameSrc":"VisitSeoul","story":"The name comes from the couple who built it, one surnamed Jo and one Bak.\nIt opened in 1979 and has been grilling pork galbi for more than forty years.\nCustomers from the first year now bring children of their own.\nThe galbi runs sweet, and the chopaju — a fermented drink made with Kooksoondang makgeolli — is only here."},{"id":"o074","name":"목노집","district":"은평구","cuisine":"보쌈","since":"1972","roadAddr":"서울특별시 은평구 연서로28길 10","jibunAddr":"서울특별시 은평구 대조동 197-2","phone":"02-355-1652","source":"오래가게","romanName":"Moknojip","enDistrict":"Eunpyeong-gu","enCuisine":"Boiled pork wraps","enAddr":"10 Yeonseo-ro 28-gil, Eunpyeong-gu, Seoul","enNameSrc":"VisitSeoul","story":"Everyone in Eunpyeong-gu knows it: pork boiled, then stir-fried with spring onion and wrapped in lettuce with gochujang.\nThat is not how bossam is usually served.\n\"Mokno\" was the long plank in old taverns where cups were set down, and a moknojujeom is a place where you drink at that plank.\nWriting left by the owner's late father is still on the walls, which is part of why people keep coming back after decades."},{"id":"o075","name":"장가구","district":"은평구","cuisine":"중식","since":"1933","roadAddr":"서울특별시 은평구 연서로4길 19","jibunAddr":"서울특별시 은평구 역촌동 34-49 2층","phone":"02-355-3678","source":"오래가게","romanName":"Janggagu","enDistrict":"Eunpyeong-gu","enCuisine":"Chinese","enAddr":"19 Yeonseo-ro 4-gil, Eunpyeong-gu, Seoul","enNameSrc":"VisitSeoul","story":"More than forty years on one spot in Eunpyeong-gu.\nDomestic ingredients only, and each dish cooked from the order, which can be slow.\nAn air conditioner sold sometime between the 1960s and the 80s is still standing inside.\nDelivery is available, but the room is the point."},{"id":"o076","name":"지대방","district":"종로구","cuisine":"찻집","since":"","roadAddr":"서울특별시 종로구 인사동길 33","jibunAddr":"서울특별시 종로구 관훈동 196-6 지상1층","phone":"02-738-5379","source":"오래가게","romanName":"Jidaebang","enDistrict":"Jongno-gu","enCuisine":"Tea house","enAddr":"33 Insadong-gil, Jongno-gu, Seoul","enNameSrc":"VisitSeoul","story":"A traditional tea house in Insa-dong, made for sitting over a cup and talking.\nMore than sixty teas, all of them hand-harvested or naturally grown.\nOrder one and a tea set arrives with a flask of hot water; the owner explains how to steep it.\nForty years show in the room, which stays quiet in the middle of Insa-dong."},{"id":"o077","name":"진고개 동대문점","district":"종로구","cuisine":"갈비탕·청국장","since":"","roadAddr":"서울특별시 종로구 종로 301-1","jibunAddr":"서울 종로구 창신동 550-1","phone":"02-763-3565","source":"오래가게","romanName":"Jingogae Dongdaemun","enDistrict":"Jongno-gu","enCuisine":"Short-rib soup & soybean stew","enAddr":"301-1 Jong-ro, Jongno-gu, Seoul","enNameSrc":"VisitSeoul","story":"A Korean restaurant that took the top prize at the 1974 national culinary competition.\nGalbijjim, jeongol, soy-marinated crab and bulgogi fill the menu.\nThe galbijjim is simmered long with medicinal herbs, deep in scent and soft to the bite.\nIt sits near Dongdaemun Station, easy to fold into a walk along the Hanyangdoseong wall."},{"id":"o081","name":"마복림 할머니집","district":"중구","cuisine":"즉석떡볶이","since":"1968","roadAddr":"서울특별시 중구 다산로35길 5","jibunAddr":"서울특별시 중구 신당동 292-112","phone":"02-2232-8930","source":"오래가게","romanName":"Mabongnim Halmeonijip","enDistrict":"Jung-gu","enCuisine":"Tteokbokki","enAddr":"5 Dasan-ro 35-gil, Jung-gu, Seoul","enNameSrc":"VisitSeoul","story":"Opened in 1953, the start of the Sindang-dong tteokbokki alley and the place that made tteokbokki a dish rather than a snack.\nMa Bok-rim's method was to mix gochujang with chunjang, which is where the sweetness comes from.\nIt cooks at the table, with whatever extras you decide to add.\nShe passed the recipe to her daughter-in-law five years before she died, and it is still made that way."}];

function submitReport(){const a=rpt.ans;const cmt=document.getElementById('cmt').value.trim();
  const L=[`[Nopo \u00b7 been there] ${rpt.rom} / ${rpt.name} (${rpt.dist})`];
  REPORT_Q.forEach(Q=>{if(a[Q.id])L.push(`\u00b7 ${Q.q.split('?')[0]}? \u2192 ${a[Q.id]}`)});
  if(cmt)L.push(`\u00b7 Note: ${cmt}`);L.push(`\u00b7 ${new Date().toISOString().slice(0,10)}`);
  const text=L.join('\n');navigator.clipboard&&navigator.clipboard.writeText(text);
  const url=opLink("whatsapp",text)||opLink("telegram",text)||opLink("line",text);closeReport();
  if(url){toast('Thanks \u2014 opening your messenger\u2026');setTimeout(function(){window.open(url,'_blank')},400);}
  else{toast('Thanks \u2014 report copied to your clipboard.');}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
document.getElementById('aboutbtn').onclick=openAbout;
document.getElementById('q').oninput=e=>{query=e.target.value.trim();draw()};
document.getElementById('sort').onclick=e=>{sortOldest=!sortOldest;e.target.textContent='Sort: '+(sortOldest?'oldest first':'A \u2192 Z');draw()};
draw();
</script></body></html>
