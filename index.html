<style>

header{padding:22px 20px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);z-index:20}

 {id:'again',q:'Would you go back?',opts:['Yes','Not sure']}];
let rpt={name:'',rom:'',dist:'',ans:{}};
function openReport(name,rome,dist){rpt={name,rom:rome,dist,ans:{}};
  const c=document.getElementById('sheetc');
  c.innerHTML=`<div class="sheeth">I\u2019ve been to ${rome}<span class="kr">${name}</span></div>
    <div class="sheetsub">Not a rating \u2014 the things maps never ask. 15 seconds. Your notes help the next traveler.</div>
    <div id="qs"></div><textarea class="cmt" id="cmt" placeholder="One line, if you like \u2014 what stood out?"></textarea>
    <button class="submit" onclick="submitReport()">Share what I saw</button><button class="cancel" onclick="closeReport()">Not now</button>`;
  const qs=document.getElementById('qs');
  REPORT_Q.forEach(Q=>{const w=document.createElement('div');w.innerHTML=`<div class="qh">${Q.q}</div>`;
    const o=document.createElement('div');o.className='opts';
    Q.opts.forEach((t,i)=>{const b=document.createElement('button');b.className='opt'+(Q.kill&&i===1?' kill':'');b.textContent=t;
      b.onclick=()=>{rpt.ans[Q.id]=t;[...o.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')};o.appendChild(b)});
    w.appendChild(o);qs.appendChild(w)});
  document.getElementById('sheet').classList.add('open')}
function closeReport(){document.getElementById('sheet').classList.remove('open')}
function submitReport(){const a=rpt.ans;const cmt=document.getElementById('cmt').value.trim();
  const L=[`[Nopo \u00b7 been there] ${rpt.rom} / ${rpt.name} (${rpt.dist})`];
  REPORT_Q.forEach(Q=>{if(a[Q.id])L.push(`\u00b7 ${Q.q.split('?')[0]}? \u2192 ${a[Q.id]}`)});
  if(cmt)L.push(`\u00b7 Note: ${cmt}`);L.push(`\u00b7 ${new Date().toISOString().slice(0,10)}`);
  const text=L.join('\n');navigator.clipboard&&navigator.clipboard.writeText(text);
  const url=opLink("whatsapp",text)||opLink("telegram",text)||opLink("line",text);closeReport();
  if(url){toast('Thanks \u2014 opening your messenger\u2026');setTimeout(function(){window.open(url,'_blank')},400);}
  else{toast('Thanks \u2014 report copied to your clipboard.');}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
document.getElementById('q').oninput=e=>{query=e.target.value.trim();draw()};
document.getElementById('sort').onclick=e=>{sortOldest=!sortOldest;e.target.textContent='Sort: '+(sortOldest?'oldest first':'A \u2192 Z');draw()};
draw();
